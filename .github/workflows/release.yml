name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  open-source-release:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v5

      - name: Validate tag matches app version
        run: |
          version=$(/usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" Info.plist)
          test "${GITHUB_REF_NAME}" = "v${version}"

      - name: Test
        run: swift test

      - name: Create ad-hoc-signed release artifacts
        run: ./Scripts/create-release.sh

      - name: Verify artifacts and checksums
        run: |
          codesign --verify --deep --strict "dist/FileMorrow.app"
          cd dist/release
          shasum -a 256 -c SHA256SUMS.txt

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            dist/release/* \
            --title "FileMorrow $GITHUB_REF_NAME" \
            --notes-file CHANGELOG.md \
            --verify-tag
